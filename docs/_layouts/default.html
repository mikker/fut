<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title }} · {{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:image" content="{{ '/assets/og.png' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ '/assets/og.png' | absolute_url }}">
    <title>{{ page.title }} · {{ site.title }}</title>
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Fut documentation home">fut<span aria-hidden="true">█</span></a>
      <a href="https://github.com/mikker/fut">GITHUB ↗</a>
    </header>

    <div class="shell">
      <aside aria-label="Documentation sections">
        <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">00 / Introduction</a>
        <a {% if page.url contains '/usage/' %}aria-current="page"{% endif %} href="{{ '/usage/' | relative_url }}">01 / Using Fut</a>
        <a {% if page.url contains '/agents/' %}aria-current="page"{% endif %} href="{{ '/agents/' | relative_url }}">02 / Agent activity</a>
        <a {% if page.url contains '/configuration/' %}aria-current="page"{% endif %} href="{{ '/configuration/' | relative_url }}">03 / Configuration</a>
        <a {% if page.url contains '/extensions/' %}aria-current="page"{% endif %} href="{{ '/extensions/' | relative_url }}">04 / Extensions</a>
        <a {% if page.url contains '/extension-authoring/' %}aria-current="page"{% endif %} href="{{ '/extension-authoring/' | relative_url }}">05 / Extension authoring</a>
        <a {% if page.url contains '/tokens/' %}aria-current="page"{% endif %} href="{{ '/tokens/' | relative_url }}">06 / Tokens</a>
        <a {% if page.url contains '/doctor/' %}aria-current="page"{% endif %} href="{{ '/doctor/' | relative_url }}">07 / Doctor</a>
        <a {% if page.url contains '/changelog/' %}aria-current="page"{% endif %} href="{{ '/changelog/' | relative_url }}">08 / Changelog</a>
      </aside>

      <main id="content">
        {{ content }}
      </main>
    </div>
  </body>
</html>
