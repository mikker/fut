[package]
name = "fut"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "~4.6", features = ["derive"] }
clap_complete = { version = "~4.6", features = ["unstable-dynamic"] }
compact_str = { version = "0.9", features = ["serde"] }
crossbeam-channel = "0.5"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", features = ["sink"] }
libc = "0.2"
libghostty-vt = { path = "vendor/libghostty-vt", default-features = false }
portable-pty = "=0.9.0"
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.9"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
rmp-serde = "1.3.1"

[dev-dependencies]
assert_cmd = "2"
criterion = "0.5"
predicates = "3"
tempfile = "3"

[profile.dev]
# Keep the development binary responsive enough to use as a daily driver while
# retaining debug info and debug assertions.
opt-level = 1

[profile.dev.package.libghostty-vt-sys]
# Ghostty's Zig Debug mode validates its full scrollback after each reverse
# index. A half-page `less` scroll emits one reverse index per row, turning a
# debug Fut build's `u` key into seconds of VT work. Omitting debug info makes
# its build script select the native terminal engine's optimized mode.
debug = false

[profile.test.package.libghostty-vt-sys]
# Keep Ghostty's safety checks under the parallel test harness; only the
# contributor-facing development binary needs the optimized native engine.
debug = true

[[bench]]
name = "render"
harness = false
