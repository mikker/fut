[tools]
rust = "1.95.0"
ruby = "3.3"
zig = "0.16.0"

[tasks.check]
depends = ["fmt", "clippy", "test"]

[tasks.build]
run = "cargo build"

[tasks."build:all"]
run = "cargo build --all-targets --all-features"

[tasks.fmt]
run = "cargo fmt --check"

[tasks.clippy]
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.fresh]
description = "Restart the debug daemon and attach without rebuilding"
run = '''
socket="${TMPDIR:-/tmp}"
socket="${socket%/}/fut-debug.sock"
config_dir="${TMPDIR:-/tmp}"
config_dir="${config_dir%/}/fut-debug-config"
rm -rf -- "$config_dir"
mkdir -p -- "$config_dir"

# Prefer a graceful stop when the daemon speaks this build's protocol. Fall
# back to its socket owner so `fresh` also replaces an older debug daemon.
if [ -S "$socket" ]; then
  target/debug/fut --socket "$socket" daemon shutdown >/dev/null 2>&1 || {
    pids="$(lsof -t -- "$socket" 2>/dev/null || true)"
    [ -z "$pids" ] || kill $pids
  }
fi

exec target/debug/fut --socket "$socket" --config-dir "$config_dir"
'''

[tasks.test]
run = "cargo test --all-targets --all-features"

[tasks."test:unit"]
run = "cargo test --lib --all-features"

[tasks."test:e2e"]
run = "cargo test --test e2e --all-features"

[tasks.journey]
description = "Run the isolated keyboard-driven daily-driver journey"
run = "cargo test --test e2e --all-features isolated_daily_driver_journey -- --nocapture --test-threads=1"

[tasks."journey:chaos"]
description = "Run a reproducible isolated keyboard chaos journey"
run = "cargo test --test e2e --all-features isolated_keyboard_chaos_journey -- --nocapture --test-threads=1"

[tasks."journey:overload"]
description = "Run the isolated Hollywood-style terminal overload journey"
run = "cargo test --test e2e --all-features isolated_hollywood_overload_journey -- --nocapture --test-threads=1"

[tasks.demo]
description = "Build and attach to a disposable multi-workspace Fut demo"
run = "bash scripts/demo"

[tasks."demo:setup"]
description = "Build the Fut demo without attaching"
run = "bash scripts/demo setup"

[tasks."demo:attach"]
description = "Attach to the running Fut demo"
run = "bash scripts/demo attach"

[tasks."demo:clean"]
description = "Stop and remove the Fut demo"
run = "bash scripts/demo clean"

[tasks."perf:bench"]
description = "Run render-pipeline microbenchmarks (feed/encode/decode/clone)"
run = "cargo bench --bench render"

[tasks."perf:e2e"]
description = "Measure end-to-end snapshot throughput and input latency against a disposable daemon"
run = "bash scripts/perf/run"

[tasks."perf:pager"]
description = "Capture and compare less forward/backward paging output and Fut VT costs"
run = "cargo run --release --example pager_measure"

[tasks."docs:setup"]
description = "Install local documentation dependencies"
run = "bundle config set --local path .bundle && bundle install"

[tasks."docs:serve"]
description = "Preview the documentation at http://127.0.0.1:4000"
depends = ["docs:setup"]
run = "bundle exec jekyll serve --source docs --destination target/docs --baseurl '' --livereload"

[tasks.release]
description = "Test and publish the next 0.x release"
run = "bash scripts/release"
